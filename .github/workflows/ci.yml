name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders (runtime uses VPS .env)
          DATABASE_URL: postgresql://fmmt:fmmt@localhost:5432/fmmt
          AUTH_SECRET: ci-build-secret
          ADMIN_PASSWORD: ci-build-password
          APP_URL: https://fmmt.events
