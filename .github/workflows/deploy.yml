name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OVH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="/opt/fmmt"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Clone initial dans $APP_DIR"
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
              git clone https://github.com/gauthierntudi/fmmt.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin https://github.com/gauthierntudi/fmmt.git
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env manquant — crée-le avant le prochain deploy"
              exit 1
            fi

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
